<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>engagetruth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="wrapper">
    <h1>engagetruth</h1>
    <p class="subtitle">behavior-based instagram engagement analysis</p>

    <div class="orb-container">
        <div class="orb"></div>
    </div>

    <div class="search-card">
        <input id="username" placeholder="instagram username">
        <button onclick="analyze()">analyze</button>
    </div>

    <div id="loading" class="hidden">analyzing...</div>

    <div id="result" class="report hidden">
        <p><b>followers:</b> <span id="followers"></span></p>
        <p><b>engagement:</b> <span id="engagement"></span>%</p>
        <p><b>risk score:</b> <span id="score"></span></p>
        <p class="verdict" id="verdict"></p>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
